<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholarship Grievance Redressal System</title>
<meta name="description" content="Multi-level grievance redressal portal for scholarship applicants, institutions and the directorate.">
<style>
:root{
  --primary:#0b4f9e;
  --primary-dark:#083a76;
  --primary-light:#e8f0fb;
  --accent:#0f9d8f;
  --bg:#eef1f6;
  --surface:#ffffff;
  --text:#1b2430;
  --muted:#5d6b7a;
  --line:#dbe2ea;
  --danger:#c62828;
  --warn:#e08a00;
  --ok:#1e7d3a;
  --info:#1565c0;
  --radius:10px;
  --shadow:0 1px 3px rgba(16,32,56,.08),0 6px 18px rgba(16,32,56,.06);
  --shadow-sm:0 1px 2px rgba(16,32,56,.10);
  font-size:15px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;color:#12253c}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
p{margin:0 0 .8em}
.hidden{display:none !important}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.center{text-align:center}
.right{text-align:right}
.nowrap{white-space:nowrap}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row.tight{gap:10px}
.grow{flex:1 1 auto}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  border:1px solid transparent;border-radius:8px;padding:9px 16px;font-size:.9rem;
  font-weight:600;cursor:pointer;background:var(--primary);color:#fff;
  transition:filter .12s ease, background .12s ease;white-space:nowrap;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff;color:var(--primary);border-color:var(--line)}
.btn.sec:hover{background:var(--primary-light);filter:none}
.btn.ghost{background:transparent;color:var(--primary);border-color:transparent}
.btn.ok{background:var(--ok)}
.btn.warn{background:var(--warn)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:5px 11px;font-size:.8rem;border-radius:7px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Inputs ---------- */
label{display:block;font-size:.82rem;font-weight:600;color:#33465c;margin-bottom:5px}
input,select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  font-size:.9rem;font-family:inherit;background:#fff;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-light);border-color:var(--primary)}
textarea{resize:vertical;min-height:90px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

/* ---------- Layout ---------- */
.topbar{
  background:linear-gradient(100deg,var(--primary-dark),var(--primary));
  color:#fff;position:sticky;top:0;z-index:40;box-shadow:var(--shadow-sm);
}
.topbar .inner{max-width:1240px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.emblem{
  width:38px;height:38px;border-radius:9px;background:rgba(255,255,255,.16);
  display:grid;place-items:center;font-size:1.25rem;flex:0 0 auto;border:1px solid rgba(255,255,255,.28)
}
.brand .t1{font-weight:700;font-size:.98rem;line-height:1.15}
.brand .t2{font-size:.72rem;opacity:.82;letter-spacing:.03em;text-transform:uppercase}
.topbar .spacer{flex:1}
.topbar .who{font-size:.8rem;opacity:.9;text-align:right;line-height:1.25}
.topbar .who b{display:block;font-size:.86rem;opacity:1}
.iconbtn{
  position:relative;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:9px;width:40px;height:40px;font-size:1.15rem;cursor:pointer;display:grid;place-items:center
}
.iconbtn:hover{background:rgba(255,255,255,.22)}
.badge-dot{
  position:absolute;top:-5px;right:-5px;background:#ff5252;color:#fff;font-size:.66rem;
  min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;font-weight:700;padding:0 4px;border:2px solid var(--primary)
}
.shell{max-width:1240px;margin:0 auto;padding:20px;display:grid;grid-template-columns:236px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.shell{grid-template-columns:1fr;padding:14px}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;box-shadow:var(--shadow-sm);position:sticky;top:78px}
.side .navlink{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#33465c;
  font-weight:600;font-size:.9rem;cursor:pointer;margin-bottom:2px
}
.side .navlink:hover{background:var(--primary-light);text-decoration:none}
.side .navlink.active{background:var(--primary);color:#fff}
.side .navlink .ic{width:20px;text-align:center}
.side .sect{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:12px 12px 5px;font-weight:700}
.content{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px;margin-bottom:18px}
.card.pad0{padding:0}
.card h2,.card h3{display:flex;align-items:center;gap:8px}

/* ---------- Stat tiles ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-sm);border-left:4px solid var(--primary)}
.tile .n{font-size:1.65rem;font-weight:800;line-height:1;color:#12253c}
.tile .l{font-size:.78rem;color:var(--muted);margin-top:5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.tile.ok{border-left-color:var(--ok)}.tile.warn{border-left-color:var(--warn)}
.tile.danger{border-left-color:var(--danger)}.tile.info{border-left-color:var(--info)}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;text-transform:capitalize}
.b-submitted{background:#e3ecfa;color:#0b4f9e}
.b-in_progress{background:#fff3d6;color:#8a5a00}
.b-escalated{background:#fde3e3;color:#a51c1c}
.b-resolved{background:#dcf3e3;color:#136c33}
.b-rejected{background:#ececf0;color:#4a4a55}
.b-closed{background:#e6e6ea;color:#4a4a55}
.b-L1{background:#e3ecfa;color:#0b4f9e}
.b-L2{background:#fff0d1;color:#8a5a00}
.b-L3{background:#f6d7f0;color:#8a2179}
.b-high{background:#fde3e3;color:#a51c1c}
.b-medium{background:#fff3d6;color:#8a5a00}
.b-low{background:#e6eef2;color:#3a5566}
.b-overdue{background:#c62828;color:#fff}

/* ---------- Tables ---------- */
.tablewrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.86rem;background:#fff}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:11px 12px;border-bottom:2px solid var(--line);white-space:nowrap;background:#f8fafc}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#f7faff}
tbody tr{cursor:pointer}
.gid{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.8rem;font-weight:700;color:var(--primary)}

/* ---------- Timeline ---------- */
.timeline{list-style:none;padding:0;margin:0}
.timeline li{position:relative;padding:0 0 16px 26px;border-left:2px solid var(--line)}
.timeline li:last-child{border-left-color:transparent;padding-bottom:0}
.timeline li:before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary-light)}
.timeline li.sys:before{background:var(--muted)}
.timeline .th{font-weight:700;font-size:.88rem}
.timeline .tm{font-size:.75rem;color:var(--muted)}
.timeline .tn{font-size:.85rem;color:#33465c;margin-top:3px}

/* ---------- Auth ---------- */
.authwrap{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:var(--bg)}
@media(max-width:860px){.authwrap{grid-template-columns:1fr}}
.authhero{
  background:linear-gradient(150deg,var(--primary-dark),var(--primary) 60%,var(--accent));
  color:#fff;padding:52px 48px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden
}
.authhero:after{content:"";position:absolute;right:-90px;bottom:-90px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.07)}
.authhero:before{content:"";position:absolute;left:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.06)}
.authhero .emblem{width:56px;height:56px;font-size:1.7rem;margin-bottom:22px}
.authhero h1{color:#fff;font-size:1.85rem;max-width:15ch}
.authhero p{opacity:.9;max-width:38ch}
.authhero .feats{margin-top:26px;display:flex;flex-direction:column;gap:11px;position:relative}
.authhero .feats div{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;opacity:.95}
.authhero .feats .ic{flex:0 0 auto}
.authpane{display:flex;align-items:center;justify-content:center;padding:32px 20px}
.authbox{width:100%;max-width:380px}
.authbox .card{padding:26px}
.demo-grid{display:grid;gap:8px;margin-top:6px}
.demobtn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left;font-size:.84rem
}
.demobtn:hover{border-color:var(--primary);background:var(--primary-light)}
.demobtn b{display:block;font-size:.86rem}
.demobtn span{color:var(--muted);font-size:.75rem}
.demobtn .role{font-size:.7rem;font-weight:700;color:var(--primary);text-transform:uppercase}

/* ---------- Misc ---------- */
.pill{display:inline-block;background:#eef2f7;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:.74rem;color:#42566b;margin:0 6px 6px 0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:.88rem}
.kv .k{color:var(--muted);font-weight:600}
@media(max-width:560px){.kv{grid-template-columns:1fr}}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .big{font-size:2.4rem;opacity:.35;display:block;margin-bottom:8px}
.notif{position:absolute;top:52px;right:0;width:340px;max-width:88vw;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);z-index:60;overflow:hidden}
.notif .nh{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#f8fafc}
.notif .list{max-height:360px;overflow:auto}
.notif .item{padding:11px 14px;border-bottom:1px solid var(--line);font-size:.84rem;cursor:pointer}
.notif .item:hover{background:#f7faff}
.notif .item.unread{background:#eef5ff}
.notif .item .t{color:var(--muted);font-size:.72rem;margin-top:3px}
.relative{position:relative}
.chart{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:.82rem}
.bar .track{background:#eef2f7;border-radius:6px;height:20px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px;background:var(--primary)}
.bar .val{text-align:right;font-weight:700;color:#33465c}
.alert{padding:11px 14px;border-radius:8px;font-size:.86rem;margin-bottom:14px;border:1px solid}
.alert.info{background:#e8f1fd;border-color:#c3daf8;color:#0b4f9e}
.alert.warn{background:#fff6e5;border-color:#ffe0a8;color:#8a5a00}
.alert.ok{background:#e7f6ec;border-color:#c3e6cf;color:#136c33}
.alert.danger{background:#fdeaea;border-color:#f6c9c9;color:#a51c1c}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar .f{min-width:150px}
.toolbar .f label{margin-bottom:3px}
.hr{height:1px;background:var(--line);margin:16px 0}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 14px;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--primary)}
footer.site{max-width:1240px;margin:0 auto;padding:18px 20px 30px;color:var(--muted);font-size:.78rem;text-align:center}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{
  position:fixed;bottom:22px;right:22px;background:#12253c;color:#fff;padding:12px 16px;border-radius:9px;
  box-shadow:var(--shadow);font-size:.88rem;z-index:100;max-width:340px;animation:up .25s ease
}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.banner-demo{background:#fff6e5;border-bottom:1px solid #ffe0a8;color:#8a5a00;font-size:.78rem;text-align:center;padding:5px 12px}

</style>
</head>
<body>
<div class="banner-demo" id="demoBanner">Demo build &middot; data is stored in this browser only</div>
<div id="app"></div>
<div id="toastHost"></div>
<script>
/* ============================================================
   Scholarship Grievance Redressal System (SGRS)
   Self-contained single-page app. No backend, no CDN.
   Data persists in this browser (localStorage).
   ============================================================ */
(function () {
  "use strict";

  /* ---------- Domain config ---------- */
  var ORG = "MBC & DNC Directorate";
  var APP = "Scholarship Grievance Redressal System";
  var DB_KEY = "sgrs_db_v2";
  var SESSION_KEY = "sgrs_session_v1";
  var YEAR = new Date().getFullYear();

  var SLA = { 1: 7, 2: 5, 3: 3 }; // days allowed at each level

  var CATEGORIES = [
    "Application not received",
    "Payment / disbursement pending",
    "Documents rejected",
    "Eligibility dispute",
    "Wrong bank / Aadhaar details",
    "Portal / technical issue",
    "Duplicate application",
    "Other"
  ];

  var SCHEMES = [
    "Post-Matric Scholarship",
    "Pre-Matric Scholarship",
    "Merit-cum-Means Scholarship",
    "Top Class Education Scheme",
    "Fellowship / Hostel grant",
    "Other / Not sure"
  ];

  var STATUSES = ["Submitted", "In Progress", "Escalated", "Resolved", "Rejected", "Closed"];
  var OPEN_STATUSES = ["Submitted", "In Progress", "Escalated"];

  var LEVEL_NAMES = { 1: "Level 1 — Institution / District", 2: "Level 2 — Directorate", 3: "Level 3 — Appellate Authority" };

  /* ---------- Tiny helpers ---------- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function nowISO() { return new Date().toISOString(); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmtDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtDay(iso) {
    var d = new Date(iso);
    return pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear();
  }
  function addDays(iso, n) { var d = new Date(iso); d.setDate(d.getDate() + n); return d.toISOString(); }
  function isOverdue(g) {
    return OPEN_STATUSES.indexOf(g.status) > -1 && g.dueAt && new Date(g.dueAt) < new Date();
  }
  function daysLeft(g) {
    if (!g.dueAt) return null;
    return Math.ceil((new Date(g.dueAt) - new Date()) / 86400000);
  }
  function statusClass(s) { return "b-" + String(s).toLowerCase().replace(/[^a-z]/g, "_"); }
  function titleCase(s) { return String(s).replace(/_/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }

  /* ---------- Storage ---------- */
  var db = null;
  function load() {
    try { db = JSON.parse(localStorage.getItem(DB_KEY)); } catch (e) { db = null; }
    if (!db || !db.users) { db = seed(); save(); }
  }
  function save() { try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {} }

  function getSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; } }
  function setSession(u) { if (u) localStorage.setItem(SESSION_KEY, JSON.stringify({ id: u.id })); else localStorage.removeItem(SESSION_KEY); }
  function currentUser() {
    var s = getSession(); if (!s) return null;
    return db.users.filter(function (u) { return u.id === s.id; })[0] || null;
  }

  /* ---------- Seed accounts only (no demo grievances) ---------- */
  function seed() {
    var users = [
      { id: "u_stu", name: "Anjali Verma", email: "student@demo.in", password: "student123", role: "student", org: "St. Xavier's College, Mumbai" },
      { id: "u_inst", name: "Registrar, Govt. Arts College", email: "institution@demo.in", password: "inst123", role: "institution", org: "Govt. Arts College, Pune" },
      { id: "u_l1", name: "District Officer — R. Nair", email: "l1@demo.in", password: "l1pass", role: "officer", level: 1, org: "District Scholarship Cell" },
      { id: "u_l2", name: "Directorate Officer — S. Iyer", email: "l2@demo.in", password: "l2pass", role: "officer", level: 2, org: ORG },
      { id: "u_l3", name: "Appellate Authority — Jt. Director", email: "l3@demo.in", password: "l3pass", role: "officer", level: 3, org: ORG },
      { id: "u_adm", name: "System Administrator", email: "admin@demo.in", password: "admin123", role: "admin", org: ORG }
    ];
    var d = {
      users: users,
      grievances: [],
      notifications: [],
      counters: {},
      created: nowISO()
    };
    // counters start
    d.counters[YEAR] = 0;

    return d;
  }
  function nextId(d) {
    d.counters[YEAR] = (d.counters[YEAR] || 0) + 1;
    return "SGRS/" + YEAR + "/" + ("000" + d.counters[YEAR]).slice(-4);
  }

  /* ---------- Notifications ---------- */
  function notify(audience, text, gid) {
    db.notifications.unshift({
      id: uid(), audience: audience, text: text, gid: gid, at: nowISO(), readBy: []
    });
    if (db.notifications.length > 300) db.notifications.length = 300;
  }
  function matchesUser(n, u) {
    if (!u) return false;
    var a = n.audience || {};
    if (a.userIds && a.userIds.indexOf(u.id) > -1) return true;
    if (a.roles && a.roles.indexOf(u.role) > -1) {
      if (a.level == null || u.level === a.level) return true;
    }
    return false;
  }
  function myNotifications(u) {
    return db.notifications.filter(function (n) { return matchesUser(n, u); });
  }
  function unreadCount(u) {
    return myNotifications(u).filter(function (n) { return n.readBy.indexOf(u.id) === -1; }).length;
  }
  function markAllRead(u) {
    myNotifications(u).forEach(function (n) { if (n.readBy.indexOf(u.id) === -1) n.readBy.push(u.id); });
    save();
  }

  /* ---------- Actions ---------- */
  function fileGrievance(data, user) {
    var created = nowISO();
    var g = {
      id: nextId(db),
      subject: data.subject,
      category: data.category,
      scheme: data.scheme,
      applicantName: data.applicantName,
      applicantType: user.role === "institution" ? "institution" : "student",
      applicationNo: data.applicationNo,
      institution: data.institution,
      description: data.description,
      status: "Submitted",
      level: 1,
      priority: data.priority || "medium",
      createdBy: user.id,
      createdByName: user.name,
      createdAt: created,
      updatedAt: created,
      dueAt: addDays(created, SLA[1]),
      assignedTo: null,
      resolution: null,
      timeline: [{ at: created, by: user.name, action: "Grievance filed", note: "Category: " + data.category, from: null, to: "Submitted", sys: false }]
    };
    db.grievances.unshift(g);
    notify({ userIds: [user.id] }, "Your grievance " + g.id + " has been filed and is pending at Level 1.", g.id);
    notify({ roles: ["officer"], level: 1 }, "New grievance " + g.id + " (" + g.category + ") filed by " + user.name + ".", g.id);
    notify({ roles: ["admin"] }, "New grievance " + g.id + " filed.", g.id);
    save();
    return g;
  }

  function addTimeline(g, user, action, note, from, to, sys) {
    g.timeline.push({ at: nowISO(), by: sys ? "System" : user.name, action: action, note: note || "", from: from, to: to, sys: !!sys });
    g.updatedAt = nowISO();
  }

  function officerAction(g, user, action, note) {
    var from = g.status;
    if (action === "progress") {
      g.status = "In Progress"; g.assignedTo = user.name;
      addTimeline(g, user, "Under review", note, from, g.status);
      notify({ userIds: [g.createdBy] }, "Grievance " + g.id + " is now under review at Level " + g.level + ".", g.id);
    } else if (action === "resolve") {
      g.status = "Resolved"; g.resolution = note; g.assignedTo = user.name;
      addTimeline(g, user, "Resolved", note, from, g.status);
      notify({ userIds: [g.createdBy] }, "Good news — grievance " + g.id + " has been resolved.", g.id);
      notify({ roles: ["admin"] }, "Grievance " + g.id + " resolved by " + user.name + ".", g.id);
    } else if (action === "reject") {
      g.status = "Rejected"; g.resolution = note; g.assignedTo = user.name;
      addTimeline(g, user, "Rejected", note, from, g.status);
      notify({ userIds: [g.createdBy] }, "Grievance " + g.id + " was rejected. Reason recorded.", g.id);
    } else if (action === "close") {
      g.status = "Closed"; g.assignedTo = user.name;
      addTimeline(g, user, "Closed", note, from, g.status);
      notify({ userIds: [g.createdBy] }, "Grievance " + g.id + " has been closed.", g.id);
    } else if (action === "escalate") {
      escalate(g, user, note, false);
      return;
    } else if (action === "note") {
      addTimeline(g, user, "Remark added", note, from, from);
      notify({ userIds: [g.createdBy] }, "A remark was added to your grievance " + g.id + ".", g.id);
    }
    save();
  }

  function escalate(g, user, note, sys) {
    var from = g.status;
    var nextLevel = Math.min(3, g.level + 1);
    g.level = nextLevel;
    g.status = "Escalated";
    g.dueAt = addDays(nowISO(), SLA[nextLevel]);
    addTimeline(g, user, sys ? "Auto-escalated" : "Escalated", (note || "") + " (now at Level " + nextLevel + ")", from, g.status, sys);
    notify({ userIds: [g.createdBy] }, "Grievance " + g.id + " escalated to Level " + nextLevel + ".", g.id);
    notify({ roles: ["officer"], level: nextLevel }, "Grievance " + g.id + " escalated to your level for action.", g.id);
    notify({ roles: ["admin"] }, "Grievance " + g.id + " escalated to Level " + nextLevel + ".", g.id);
    save();
  }

  function runAutoEscalation() {
    var changed = false;
    db.grievances.forEach(function (g) {
      if (OPEN_STATUSES.indexOf(g.status) === -1) return;
      if (!isOverdue(g)) return;
      if (g.level < 3) {
        escalate(g, { name: "System" }, "SLA breached.", true);
        changed = true;
      }
    });
    if (changed) save();
  }

    }
    var form = '<div class="card"><form data-form="track" class="toolbar" style="margin:0">' +
      '<div class="f grow"><label>Grievance ID</label><input name="gid" placeholder="SGRS/' + YEAR + '/0001" value="' + esc(id) + '"></div>' +
      '<button class="btn" type="submit">Track</button></form>' +
      '<div class="small muted" style="margin-top:8px">Example: <a href="#/track/SGRS/' + YEAR + '/0001">SGRS/' + YEAR + '/0001</a></div></div>';
    var body = '<h1>Track a grievance</h1><p class="muted">Public status tracking — no sign-in required.</p>' + form + inner;
    return u ? shell(u, "track", body) : '<div class="shell" style="grid-template-columns:1fr;max-width:820px">' + body + '<div class="center"><a href="#/login">&larr; Back to sign in</a></div></div>';
  }

  function viewNotifications(u) {
    var list = myNotifications(u);
    var items = list.length ? list.map(function (n) {
      var unread = n.readBy.indexOf(u.id) === -1;
      return '<div class="item ' + (unread ? "unread" : "") + '" data-act="opennotif" data-gid="' + esc(n.gid || "") + '">' +
        esc(n.text) + '<div class="t">' + fmtDate(n.at) + '</div></div>';
    }).join("") : '<div class="empty"><span class="big">&#128276;</span>No notifications yet.</div>';
    var body = '<div class="between" style="margin-bottom:14px"><h1 style="margin:0">Notifications</h1>' +
      '<button class="btn sec" data-act="markread">Mark all read</button></div>' +
      '<div class="card pad0"><div class="list">' + items + '</div></div>';
    return shell(u, "notifications", body);
  }

  function notifPanelHTML(u) {
    var list = myNotifications(u).slice(0, 8);
    var items = list.length ? list.map(function (n) {
      var unread = n.readBy.indexOf(u.id) === -1;
      return '<div class="item ' + (unread ? "unread" : "") + '" data-act="opennotif" data-gid="' + esc(n.gid || "") + '">' + esc(n.text) + '<div class="t">' + fmtDate(n.at) + '</div></div>';
    }).join("") : '<div class="empty small" style="padding:24px">No notifications.</div>';
    return '<div class="notif"><div class="nh"><b>Notifications</b><a class="small" href="#/notifications" data-act="closenotif">View all</a></div><div class="list">' + items + '</div></div>';
  }

  /* ---------- Render ---------- */
  function render() {
    runAutoEscalation();
    var r = route();
    var u = currentUser();
    var app = $("#app");
    var publicRoutes = ["login", "track", ""];

    if (!u) {
      if (r.name === "track") { app.innerHTML = viewTrack(null, r.arg); return; }
      app.innerHTML = viewLogin(); return;
    }
    if (r.name === "login" || r.name === "") { go("dashboard"); return; }

    switch (r.name) {
      case "dashboard": app.innerHTML = viewDashboard(u); break;
      case "file": app.innerHTML = viewFile(u); break;
      case "mine": app.innerHTML = viewMine(u); break;
      case "queue": app.innerHTML = u.role === "officer" ? viewQueue(u) : viewDashboard(u); break;
      case "admin": app.innerHTML = u.role === "admin" ? viewAdmin(u) : viewDashboard(u); break;
      case "users": app.innerHTML = u.role === "admin" ? viewUsers(u) : viewDashboard(u); break;
      case "g": app.innerHTML = viewGrievance(u, r.arg); break;
      case "track": app.innerHTML = viewTrack(u, r.arg); break;
      case "notifications": app.innerHTML = viewNotifications(u); break;
      default: app.innerHTML = viewDashboard(u);
    }
  }

  /* ---------- Events ---------- */
  function toast(msg) {
    var host = $("#toastHost");
    var t = document.createElement("div");
    t.className = "toast"; t.textContent = msg;
    host.appendChild(t);
    setTimeout(function () { t.style.opacity = "0"; t.style.transition = "opacity .3s"; }, 2600);
    setTimeout(function () { t.remove(); }, 3000);
  }

  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (!f.matches || !f.matches("form[data-form]")) return;
    e.preventDefault();
    var kind = f.getAttribute("data-form");
    var fd = new FormData(f);

    if (kind === "login") {
      var email = (fd.get("email") || "").trim().toLowerCase();
      var pass = fd.get("password");
      var u = db.users.filter(function (x) { return x.email.toLowerCase() === email && x.password === pass; })[0];
      var err = $("#loginErr");
      if (!u) { if (err) { err.textContent = "Invalid email or password. Try a demo account below."; err.classList.remove("hidden"); } return; }
      setSession(u); toast("Signed in as " + u.name); go("dashboard"); render(); return;
    }
    if (kind === "file") {
      var u2 = currentUser();
      var g = fileGrievance({
        subject: (fd.get("subject") || "").trim(),
        category: fd.get("category"), scheme: fd.get("scheme"),
        applicantName: (fd.get("applicantName") || "").trim(),
        applicationNo: (fd.get("applicationNo") || "").trim(),
        institution: (fd.get("institution") || "").trim(),
        description: (fd.get("description") || "").trim(),
        priority: fd.get("priority")
      }, u2);
      toast("Grievance " + g.id + " filed");
      go("g/" + g.id); render(); return;
    }
    if (kind === "track") {
      var q = (fd.get("gid") || "").trim();
      if (q) go("track/" + q); else go("track");
      render(); return;
    }
  });

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    var u = currentUser();
    if (!t) {
      // close notif panel if clicking outside
      var panel = $("#notifPanel");
      if (panel && panel.innerHTML && !e.target.closest(".iconbtn") && !e.target.closest(".notif")) { panel.innerHTML = ""; }
      return;
    }
    var act = t.getAttribute("data-act");

    if (act === "demo") {
      var em = t.getAttribute("data-email"), pw = t.getAttribute("data-pass");
      var f = $('form[data-form="login"]');
      f.email.value = em; f.password.value = pw;
      f.querySelector('button[type=submit]').click(); return;
    }
    if (act === "logout") { setSession(null); go("login"); render(); return; }
    if (act === "go-file") { go("file"); return; }
    if (act === "open") { go("g/" + t.getAttribute("data-id")); return; }
    if (act === "notif") {
      var p = $("#notifPanel");
      p.innerHTML = p.innerHTML ? "" : notifPanelHTML(u);
      return;
    }
    if (act === "closenotif") { var pp = $("#notifPanel"); if (pp) pp.innerHTML = ""; return; }
    if (act === "opennotif") {
      var gid = t.getAttribute("data-gid");
      var pnl = $("#notifPanel"); if (pnl) pnl.innerHTML = "";
      if (gid && findG(gid)) { go("g/" + gid); }
      return;
    }
    if (act === "markread") { markAllRead(u); render(); toast("All notifications marked read"); return; }
    if (act === "clearfilter") {
      document.querySelectorAll("[data-filter]").forEach(function (el) { el.value = ""; });
      applyFilter(); return;
    }
    if (act === "gact") {
      var g2 = findG(t.getAttribute("data-id"));
      var op = t.getAttribute("data-op");
      var noteEl = $("#actNote");
      var note = noteEl ? noteEl.value.trim() : "";
      if ((op === "resolve" || op === "reject") && !note) { toast("Please add a remark before " + op + "ing."); return; }
      officerAction(g2, u, op, note);
      toast("Action recorded: " + titleCase(op));
      render(); return;
    }
  });

  document.addEventListener("input", function (e) {
    if (e.target.matches && e.target.matches("[data-filter]")) applyFilter();
  });
  document.addEventListener("change", function (e) {
    if (e.target.matches && e.target.matches("[data-filter]")) applyFilter();
  });

  function applyFilter() {
    var get = function (k) { var el = document.querySelector('[data-filter="' + k + '"]'); return el ? el.value.trim().toLowerCase() : ""; };
    var st = get("status"), cat = get("category"), pr = get("priority"), q = get("q");
    var u = currentUser();
    var base = (u.role === "admin") ? db.grievances.slice() : visibleGrievances(u);
    var list = base.filter(function (g) {
      if (st && g.status.toLowerCase() !== st) return false;
      if (cat && g.category.toLowerCase() !== cat) return false;
      if (pr && g.priority.toLowerCase() !== pr) return false;
      if (q) {
        var hay = (g.id + " " + g.applicantName + " " + (g.applicationNo || "") + " " + g.subject).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function (a, b) { return new Date(b.updatedAt) - new Date(a.updatedAt); });
    var target = document.getElementById("adminTable") || document.getElementById("queueTable");
    if (target) target.innerHTML = grievanceTable(list);
  }

  window.addEventListener("hashchange", render);

  /* ---------- Boot ---------- */
  load();
  runAutoEscalation();
  if (!location.hash) location.hash = currentUser() ? "#/dashboard" : "#/login";
  render();
})();

</script>
</body>
</html>
